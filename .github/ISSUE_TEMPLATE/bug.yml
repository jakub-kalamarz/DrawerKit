name: Bug report
description: Report reproducible DrawerKit behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small view or repository that demonstrates the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DrawerKit version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Xcode, iOS, and device
    validations:
      required: true
